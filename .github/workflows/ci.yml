name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Run Linters
        run: npm run lint

      - name: Run Automated Unit Tests
        run: npm run test

      - name: Build Packages
        run: npm run build
