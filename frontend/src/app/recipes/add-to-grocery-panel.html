<form class="panel" [formGroup]="form" (ngSubmit)="addMissing()">
  <label class="ui-label">
    Add ingredients (existing ingredients in the list will be combined)
    <span class="list-row">
      <select class="ui-field" formControlName="listId">
        @for (list of lists(); track list.id) {
          <option [value]="list.id">{{ list.name }} ({{ list.items.length }} items)</option>
        }
        <option [value]="newList">+ New list</option>
      </select>
      @if (listId() !== newList) {
        <a class="view-link" routerLink="/grocery" [queryParams]="{ list: listId() }">View</a>
      }
    </span>
  </label>

  @if (listId() === newList) {
    <label class="ui-label">
      New list name
      <input class="ui-field" formControlName="newListName" />
    </label>
  }

  @if (error(); as message) {
    <p class="ui-error" role="alert">{{ message }}</p>
  }

  <div class="grocery-actions">
    <button
      type="submit"
      class="action-button grocery-button"
      [disabled]="loading() || saving() || missingCount() === 0"
    >
      Add {{ missingCount() }} to Grocery List ({{ servings() }}
      {{ servings() === 1 ? 'serving' : 'servings' }})
    </button>

  </div>
</form>
