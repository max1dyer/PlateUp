<button
  type="button"
  class="save"
  [class.saved]="saved()"
  [attr.aria-pressed]="saved()"
  [attr.aria-label]="(saved() ? 'Unsave ' : 'Save ') + recipeTitle()"
  [title]="saved() ? 'Saved — tap to remove' : 'Save recipe'"
  [disabled]="saving()"
  (click)="toggle($event)"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"
    />
  </svg>
  <span class="label">{{ saved() ? 'Saved' : 'Save' }}</span>
</button>
