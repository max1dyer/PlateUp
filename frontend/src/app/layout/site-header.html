<header class="site-header">
  <nav class="inner" aria-label="Main">
    <a routerLink="/home" class="logo-link" [style.left]="leftPercent(14)">
      <img src="logo.png" alt="PlateUp home" class="logo" />
    </a>
    @for (link of links; track link.path) {
      <a
        class="nav-link"
        [routerLink]="link.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [style.left]="leftPercent(link.left)"
        [style.top.px]="link.top"
        >{{ link.label }}</a
      >
    }
    @if (session.isSignedIn()) {
      <button
        type="button"
        class="nav-link"
        [style.left]="leftPercent(account.left)"
        [style.top.px]="account.top"
        (click)="logOut()"
      >
        Log out
      </button>
    } @else {
      <a
        class="nav-link"
        routerLink="/login"
        routerLinkActive="active"
        [style.left]="leftPercent(account.left)"
        [style.top.px]="account.top"
        >Log in</a
      >
    }
  </nav>
</header>
